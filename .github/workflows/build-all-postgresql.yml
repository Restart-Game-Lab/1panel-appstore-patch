name: Build All PostgreSQL Patch

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  POSTGIS_VERSION: "3.5.3"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - pg_version: "12.22"
            pgvector_version: "0.7.4"
          - pg_version: "13.23"
            pgvector_version: "0.8.2"
          - pg_version: "14.23"
            pgvector_version: "0.8.2"
          - pg_version: "15.18"
            pgvector_version: "0.8.2"
          - pg_version: "16.14"
            pgvector_version: "0.8.2"
          - pg_version: "17.10"
            pgvector_version: "0.8.2"
          - pg_version: "18.4"
            pgvector_version: "0.8.2"

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/postgresql-patch
          tags: |
            type=raw,value=${{ matrix.pg_version }}-alpine
            type=raw,value=latest,enable=${{ matrix.pg_version == '18.4' }}
          labels: |
            org.opencontainers.image.title=PostgreSQL Patch
            org.opencontainers.image.description=PostgreSQL ${{ matrix.pg_version }} + pgvector + pg_repack + pg_hint_plan + pg_cron + PostGIS
            org.opencontainers.image.version=${{ matrix.pg_version }}-alpine
            pg.version=${{ matrix.pg_version }}
            extensions.pgvector.version=${{ matrix.pgvector_version }}
            extensions.postgis.version=${{ env.POSTGIS_VERSION }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./apps/postgresql-pgvector/${{ matrix.pg_version }}-alpine/build
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PG_VERSION=${{ matrix.pg_version }}
            PGVECTOR_VERSION=${{ matrix.pgvector_version }}
            POSTGIS_VERSION=${{ env.POSTGIS_VERSION }}
          cache-from: type=gha,scope=pg${{ matrix.pg_version }}
          cache-to: type=gha,mode=max,scope=pg${{ matrix.pg_version }}

      - name: Verify image
        run: |
          IMAGE="ghcr.io/${{ github.repository }}/postgresql-patch:${{ matrix.pg_version }}-alpine"
          docker pull "${IMAGE}"
          docker run --rm "${IMAGE}" sh -c "
            echo '=== PostgreSQL Version ==='
            postgres --version
            echo '=== Extensions Check ==='
            find /usr/local/lib /usr/local/share -name 'vector.so' -o -name 'pg_repack.so' -o -name 'pg_cron.so' -o -name 'pg_hint_plan.so' -o -name 'postgis*.so' 2>/dev/null | while read f; do echo \"OK: \$(basename \$f)\"; done
          "
