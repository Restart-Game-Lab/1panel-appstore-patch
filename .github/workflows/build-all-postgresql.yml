name: Build All PostgreSQL Patch

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  SOURCE_REPO: Restart-Game-Lab/postgresql-patch
  SOURCE_REF: master

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - pg_version: "12.22"
            pgvector_version: "0.7.4"
          - pg_version: "13.23"
            pgvector_version: "0.8.2"
          - pg_version: "14.23"
            pgvector_version: "0.8.2"
          - pg_version: "15.18"
            pgvector_version: "0.8.2"
          - pg_version: "16.14"
            pgvector_version: "0.8.2"
          - pg_version: "17.10"
            pgvector_version: "0.8.2"
          - pg_version: "18.4"
            pgvector_version: "0.8.2"

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/postgresql-patch
          tags: |
            type=raw,value=${{ matrix.pg_version }}-alpine-patch
            type=raw,value=latest,enable=${{ matrix.pg_version == '18.4' }}
          labels: |
            org.opencontainers.image.title=PostgreSQL Patch
            org.opencontainers.image.description=PostgreSQL ${{ matrix.pg_version }} + pre-compiled extensions
            org.opencontainers.image.version=${{ matrix.pg_version }}-alpine-patch
            pg.version=${{ matrix.pg_version }}
            extensions.included=pgvector,pg_repack,pg_hint_plan,pg_cron,postgis

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./build
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PG_VERSION=${{ matrix.pg_version }}
            PGVECTOR_VERSION=${{ matrix.pgvector_version }}
          cache-from: type=gha,scope=pg${{ matrix.pg_version }}
          cache-to: type=gha,mode=max,scope=pg${{ matrix.pg_version }}

      - name: Verify image
        run: |
          TAG="${{ matrix.pg_version }}-alpine-patch"
          IMAGE="ghcr.io/${{ github.repository_owner }}/postgresql-patch:${TAG}"
          docker pull "${IMAGE}"
          docker run --rm "${IMAGE}" sh -c "
            echo '=== PostgreSQL Version ==='
            postgres --version
            echo '=== pgvector Check ==='
            ls /usr/local/lib/postgresql/vector.so 2>/dev/null && echo 'pgvector .so found' || echo 'pgvector .so not found'
          "
