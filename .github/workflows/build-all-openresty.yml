name: Build All OpenResty Tongsuo

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  TONGSUO_VERSION: "8.5.0-pre1"
  SOURCE_REPO: Restart-Game-Lab/openresty-tongsuo
  SOURCE_REF: main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - openresty_version: "1.21.4.3"
            panel_version: "3-3"
            codename: "focal"
          - openresty_version: "1.27.1.2"
            panel_version: "5-1"
            codename: "focal"
          - openresty_version: "1.29.2.5"
            panel_version: "0"
            codename: "noble"
          - openresty_version: "1.31.1.1"
            panel_version: "0"
            codename: "noble"
          - openresty_version: "1.31.1.1"
            panel_version: "2-1"
            codename: "noble"
            latest: true

    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/openresty-tongsuo
          tags: |
            type=raw,value=${{ matrix.openresty_version }}-${{ matrix.panel_version }}-${{ matrix.codename }}-tongsuo
            type=raw,value=latest,enable=${{ matrix.latest == true }}
          labels: |
            org.opencontainers.image.title=OpenResty Tongsuo
            org.opencontainers.image.description=OpenResty ${{ matrix.openresty_version }} + Tongsuo ${{ env.TONGSUO_VERSION }}
            org.opencontainers.image.version=${{ matrix.openresty_version }}-${{ matrix.panel_version }}-${{ matrix.codename }}-tongsuo
            tongsuo.version=${{ env.TONGSUO_VERSION }}
            openresty.version=${{ matrix.openresty_version }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./build
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RESTY_OPENSSL_VERSION=${{ env.TONGSUO_VERSION }}
            RESTY_VERSION=${{ matrix.openresty_version }}
            PANEL_OPENRESTY_VERSION=${{ matrix.openresty_version }}-${{ matrix.panel_version }}-${{ matrix.codename }}
            RESTY_J=4
          cache-from: type=gha,scope=openresty-${{ matrix.openresty_version }}-${{ matrix.panel_version }}-${{ matrix.codename }}
          cache-to: type=gha,mode=max,scope=openresty-${{ matrix.openresty_version }}-${{ matrix.panel_version }}-${{ matrix.codename }}

      - name: Verify image
        run: |
          TAG="${{ matrix.openresty_version }}-${{ matrix.panel_version }}-${{ matrix.codename }}-tongsuo"
          IMAGE="ghcr.io/${{ github.repository_owner }}/openresty-tongsuo:${TAG}"
          docker pull "${IMAGE}"
          docker run --rm "${IMAGE}" sh -c "
            echo '=== Tongsuo Version ==='
            /usr/local/openresty/openssl3/bin/openssl version
            echo '=== SM2 Check ==='
            /usr/local/openresty/openssl3/bin/openssl ecparam -list_curves 2>&1 | grep -i sm2 || echo 'SM2: not listed'
            echo '=== SM3 Check ==='
            echo test | /usr/local/openresty/openssl3/bin/openssl dgst -sm3 2>&1 | head -1
            echo '=== SM4 Check ==='
            echo test | /usr/local/openresty/openssl3/bin/openssl enc -sm4-ecb -nosalt -pass pass:test 2>&1 | head -1
            echo '=== OpenResty Version ==='
            openresty -v 2>&1
          "
