name: Build All OpenResty Tongsuo

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - openresty_version: "1.21.4.3"
            panel_version: "3-3"
            codename: "focal"
            version_dir: "1.21.4.3-3-3-focal-tongsuo"
            tongsuo_version: "8.4.0"
          - openresty_version: "1.27.1.2"
            panel_version: "5-1"
            codename: "focal"
            version_dir: "1.27.1.2-5-1-focal-tongsuo"
            tongsuo_version: "8.4.0"
          - openresty_version: "1.29.2.5"
            panel_version: "0"
            codename: "noble"
            version_dir: "1.29.2.5-0-noble-tongsuo"
            tongsuo_version: "8.5.0-pre1"
          - openresty_version: "1.31.1.1"
            panel_version: "0"
            codename: "noble"
            version_dir: "1.31.1.1-0-noble-tongsuo"
            tongsuo_version: "8.5.0-pre1"
          - openresty_version: "1.31.1.1"
            panel_version: "2-1"
            codename: "noble"
            version_dir: "1.31.1.1-2-1-noble-tongsuo"
            tongsuo_version: "8.5.0-pre1"
            latest: true

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/openresty-tongsuo
          tags: |
            type=raw,value=${{ matrix.version_dir }}
            type=raw,value=latest,enable=${{ matrix.latest == true }}
          labels: |
            org.opencontainers.image.title=OpenResty Tongsuo
            org.opencontainers.image.description=OpenResty ${{ matrix.openresty_version }} + Tongsuo ${{ matrix.tongsuo_version }}
            org.opencontainers.image.version=${{ matrix.version_dir }}
            tongsuo.version=${{ matrix.tongsuo_version }}
            openresty.version=${{ matrix.openresty_version }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./apps/openresty-tongsuo/${{ matrix.version_dir }}/build
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RESTY_OPENSSL_VERSION=${{ matrix.tongsuo_version }}
            RESTY_VERSION=${{ matrix.openresty_version }}
            RESTY_J=4
          cache-from: type=gha,scope=openresty-${{ matrix.version_dir }}
          cache-to: type=gha,mode=max,scope=openresty-${{ matrix.version_dir }}

      - name: Verify image
        run: |
          IMAGE="ghcr.io/${{ github.repository }}/openresty-tongsuo:${{ matrix.version_dir }}"
          docker pull "${IMAGE}"
          docker run --rm "${IMAGE}" sh -c "
            echo '=== Tongsuo Version ==='
            /usr/local/openresty/openssl3/bin/openssl version
            echo '=== SM2 Check ==='
            /usr/local/openresty/openssl3/bin/openssl ecparam -list_curves 2>&1 | grep -i sm2 || echo 'SM2: not listed'
            echo '=== SM3 Check ==='
            echo test | /usr/local/openresty/openssl3/bin/openssl dgst -sm3 2>&1 | head -1
            echo '=== SM4 Check ==='
            echo test | /usr/local/openresty/openssl3/bin/openssl enc -sm4-ecb -nosalt -pass pass:test 2>&1 | head -1
            echo '=== OpenResty Version ==='
            openresty -v 2>&1
          "
